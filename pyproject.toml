[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Personal daily scanner for dislocated, undervalued US stocks"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "typer>=0.12",
    "yfinance>=1.7",
]

[project.scripts]
analyzer = "analyzer.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (opt-in with: uv run pytest -m live)",
    "realdb: reads data/analyzer.db read-only, slow (opt-in with: uv run pytest -m realdb)",
]
addopts = "-m 'not live and not realdb'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # long SQL strings; Typer options as defaults
