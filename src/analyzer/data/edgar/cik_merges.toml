# Companies whose XBRL history continues under a predecessor CIK, for example after a
# holding-company reorganization. `ticker` is resolved to its current CIK through SEC's
# ticker map; a predecessor equal to the current CIK is ignored.
# Verified by the live test in Task 17 and by `analyzer audit` (flag "check CIK merge").
#
# Entries added 2026-10-11 from the first full audit. Each predecessor was checked against SEC:
# its name, and its revenue for every period it shares with its successor's comparatives (all
# agree within 0.5%, except one or two restated periods for LIN, CI, STE and TPL). Rejected:
# APO (only 7 of 16 periods agree after the Athene merger), reorganizations whose accounting
# predecessor files no XBRL (SW, TKO, FTI, BKR, DD, CRH).

[[merge]]
ticker = "XOM"
predecessor_ciks = [34088]

